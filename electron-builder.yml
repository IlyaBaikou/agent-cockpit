appId: com.animaplay.agenthub
productName: Agent Hub
directories:
  output: installers
files:
  - dist/src/**/*
  - ui/hub.html
  - ui/hub.css
  - ui/hub.js
  - package.json
asar: true
npmRebuild: false
artifactName: Agent-Hub-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  identity: null
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Agent Hub
  deleteAppDataOnUninstall: false
publish: null

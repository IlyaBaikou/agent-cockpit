name: Desktop installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run check
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify native CLI diagnostics on desktop OS
        run: npx vitest run test/agent-diagnostics.test.ts test/diagnostic-delivery.test.ts test/process-diagnostics.test.ts
      - name: Verify context memory UI with synthetic data
        timeout-minutes: 2
        run: node node_modules/electron/cli.js scripts/smoke-context-ui.cjs
      - run: npm run desktop:dist -- --${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify both Mac bundle signatures
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          for bundle in 'installers/mac-arm64/Agent Hub.app' 'installers/mac/Agent Hub.app'; do
            codesign --verify --deep --strict --verbose=2 "$bundle"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Contents/Info.plist")" = com.animaplay.agenthub
            codesign -dv "$bundle" 2>&1 | grep -Fx 'Identifier=com.animaplay.agenthub'
          done
      - name: Smoke test packaged application on Mac
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            "installers/mac-arm64/Agent Hub.app/Contents/MacOS/Agent Hub" --smoke-test
          else
            "installers/mac/Agent Hub.app/Contents/MacOS/Agent Hub" --smoke-test
          fi
      - name: Smoke test packaged application on Windows
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $probe = Start-Process -FilePath 'installers/win-unpacked/Agent Hub.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw "Packaged application failed: $($probe.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            installers/*.dmg
            installers/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create checksums
        working-directory: installers
        run: sha256sum *.dmg *.exe > SHA256SUMS.txt
      - name: Publish pilot release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" installers/*.dmg installers/*.exe installers/SHA256SUMS.txt --verify-tag --prerelease --title "Agent Hub $RELEASE_TAG · pilot" --notes-file docs/RELEASE-NOTES.md
